    - name: Preserve complete and partial observations
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-large-ios
        retention-days: 90
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/pdf-5538-large-ios/*.json
          ${{ runner.temp }}/pdf-5538-large-ios/*.txt
          ${{ runner.temp }}/pdf-5538-large-ios/*.diff
          ${{ runner.temp }}/pdf-5538-large-ios/*.log
          ${{ runner.temp }}/pdf-5538-large-ios/probe/
          ${{ runner.temp }}/pdf-5538-large-ios/native.xcresult/
  upstream_apple:
    name: Isolated upstream CoreGraphics / Flutter 3.50 only here
    needs: corpus
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.50.0
        cache: 'false'
    - uses: actions/download-artifact@v8.0.2
      with:
        name: pdf-5538-pinned-corpus
        path: ${{ runner.temp }}/pdf-5538-inputs
    - name: Compare pinned upstream PDFium and CoreGraphics backends
      run: |
        python3 tool/issue5538_ci/internal_apple_run.py --flutter "$FLUTTER_ROOT/bin/flutter" \
          --corpus-manifest "$RUNNER_TEMP/pdf-5538-inputs/pdf-5538-corpus/corpus.json" \
          --output "$RUNNER_TEMP/pdf-5538-upstream-apple"
    - name: Preserve complete and partial observations
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-upstream-apple
        retention-days: 90
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/pdf-5538-upstream-apple/*.json
          ${{ runner.temp }}/pdf-5538-upstream-apple/*.log
          ${{ runner.temp }}/pdf-5538-upstream-apple/*.lock
