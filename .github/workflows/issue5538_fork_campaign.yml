        path: |
          ${{ steps.evidence-root.outputs.root }}/pdf-5538-large-export/**
          ${{ steps.evidence-root.outputs.root }}/pdf-5538-session/**
          ${{ steps.evidence-root.outputs.root }}/pdf-5538-native/*.json
  highlights:
    name: Linux profile / real Hebrew highlight helpers
