  large_ios_export:
    name: iOS Simulator / large real PDF through Files
    needs: corpus
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: macos-latest
    timeout-minutes: 100
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
