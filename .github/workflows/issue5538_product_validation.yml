name: PDF 5538 combined product validation in fork
on:
  push:
    branches: [ci/5538-proven-client-improvements-20261124]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-5538-product-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  OTZARIA_REQUIRE_SEARCH_ENGINE: '1'
jobs:
  product:
    name: Full analysis and PDF product regressions / ${{ matrix.os }}
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the exact committed dependencies
        run: |
          set -euo pipefail
          flutter --version --machine > "$RUNNER_TEMP/pdf-product-sdk.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pdf-product-source.txt"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Require complete analysis with no diagnostics
        run: |
          set -euo pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/pdf-product-analyze.log"
      - name: Verify layout, no-text-layer detection and advanced-search highlighting
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 --reporter expanded \
            --file-reporter "json:$RUNNER_TEMP/pdf-product-tests.json" \
            test/pdf_book/book_view_layout_memo_test.dart \
            test/pdf_book/pdf_search_highlight_pattern_test.dart \
            test/pdf_book/pdf_search_no_text_layer_test.dart \
            test/pdf_book/pdf_page_highlights_test.dart 2>&1 | tee "$RUNNER_TEMP/pdf-product-tests.log"
          git diff --exit-code -- pubspec.yaml pubspec.lock lib test
      - name: Preserve complete or failed validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-5538-product-validation-${{ runner.os }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pdf-product-sdk.json
            ${{ runner.temp }}/pdf-product-source.txt
            ${{ runner.temp }}/pdf-product-analyze.log
            ${{ runner.temp }}/pdf-product-tests.json
            ${{ runner.temp }}/pdf-product-tests.log
