name: PDF 5538 native font recovery A B C in fork
'on':
  push:
    branches:
    - perf/5538-final-measurements-20261124
    paths:
    - .github/workflows/issue5538_font_profile.yml
    - tool/issue5538_ci/font_profile_plan.json
    - tool/issue5538_ci/*font_fallback*
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: pdf-5538-font-profile-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fonts:
    name: Native missing-font events / actual app / eight scenarios / A B C
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
    - name: Prepare the supported Linux build container
      run: "set -euo pipefail\napt-get update -y\napt-get install -y ca-certificates curl git jq unzip xz-utils\
        \ zstd python3 python3-venv nodejs \\\n  build-essential clang-14 cmake libblkid1 libcurl4-openssl-dev libglib2.0-dev\
        \ \\\n  libgtk-3-dev liblzma5 liblzma-dev libsecret-1-dev libsoup-3.0-dev \\\n  libwebkit2gtk-4.1-dev libxkbcommon-dev\
        \ ninja-build openjdk-17-jdk-headless \\\n  pkg-config xvfb xauth binutils dbus dbus-x11 openbox wmctrl\
        \ x11-utils \\\n  x11-xserver-utils libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils\nupdate-alternatives\
        \ --install /usr/bin/clang clang /usr/bin/clang-14 100\nupdate-alternatives --install /usr/bin/clang++ clang++\
        \ /usr/bin/clang++-14 100\ngit config --global --add safe.directory '*'\n{\n  echo \"RUSTUP_HOME=$RUNNER_TEMP/pdf-5538-rustup\"\
        \n  echo \"CARGO_HOME=$RUNNER_TEMP/pdf-5538-cargo\"\n  echo 'JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'\n\
        \  echo 'WPE_SDK=/opt/wpe-sdk'\n  echo 'PKG_CONFIG_PATH=/opt/wpe-sdk/lib/pkgconfig'\n  echo 'LD_LIBRARY_PATH=/opt/wpe-sdk/lib'\n\
        \  echo 'LIBRARY_PATH=/opt/wpe-sdk/lib'\n  echo 'CC=clang'\n  echo 'CXX=clang++'\n  echo 'CFLAGS=-Wno-error=unknown-warning-option'\n\
        \  echo 'CXXFLAGS=-Wno-error=unknown-warning-option'\n  echo 'LIBGL_ALWAYS_SOFTWARE=1'\n} >> \"$GITHUB_ENV\"\
        \n"
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: 'false'
    - uses: dtolnay/rust-toolchain@stable
    - name: Install the pinned Linux WPE runtime
      env:
        WPE_RUNTIME_SHA256: ca7e706c0ec2f66623fede2c369e3e13339448843e125f2ccd1553f4a3c4bcaf
      run: 'set -euo pipefail

        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

        asset=wpe-runtime-2.48.7-linux-x86_64.tar.zst

        base=https://github.com/Otzaria/otzaria-wpe-runtime/releases/download/wpe-2.48.7-print-to-pdf

        curl -fSL --retry 3 --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/$asset" "$base/$asset"

        printf ''%s  %s\n'' "$WPE_RUNTIME_SHA256" "$RUNNER_TEMP/$asset" | sha256sum -c -

        tar -C /opt -I zstd -xf "$RUNNER_TEMP/$asset"

        pkg-config --print-errors --exists wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0 wpe-1.0

        '
    - name: Verify shared harness, frozen sources and native producer
      run: "set -euo pipefail\npython3 -m venv \"$RUNNER_TEMP/pdf-5538-font-python\"\n\"$RUNNER_TEMP/pdf-5538-font-python/bin/python\"\
        \ -m pip install PyYAML==6.0.3 Pillow==13.0.0 pypdf==6.21.4\necho \"$RUNNER_TEMP/pdf-5538-font-python/bin\"\
        \ >> \"$GITHUB_PATH\"\n\"$RUNNER_TEMP/pdf-5538-font-python/bin/python\" -B -m unittest discover -s tool/issue5538_ci\
        \ -p 'font_fallback_profile_test.py'\nwhile IFS= read -r revision; do\n  git fetch --no-tags https://github.com/yom-chadash/otzaria.git\
        \ \"$revision\"\ndone < <(python3 -c 'import json; print(\"\\n\".join(json.load(open(\"tool/issue5538_ci/font_profile_plan.json\"\
        )).values()))')\nmkdir -p \"$RUNNER_TEMP/pdf-5538-font-preflight\"\nflutter pub get --enforce-lockfile 2>&1\
        \ | tee \"$RUNNER_TEMP/pdf-5538-font-preflight/resolve.log\"\nflutter analyze --no-pub 2>&1 | tee \"$RUNNER_TEMP/pdf-5538-font-preflight/analyze.log\"\
        \npython3 tool/issue5538_ci/prepare_native_inputs.py --output \"$RUNNER_TEMP/pdf-5538-native\"\n"
    - name: Complete replacement scenario with fresh full A/B and B/C blocks
      run: "set -euo pipefail\nbash tool/issue5538_ci/run_linux_desktop.sh \"$RUNNER_TEMP/pdf-5538-font-session\"\
        \ \\\n  python3 tool/issue5538_ci/run_font_fallback_profile.py \\\n  --plan tool/issue5538_ci/font_profile_plan.json\
        \ \\\n  --scenarios replace-pending-font \\\n  --pdfium \"$RUNNER_TEMP/pdf-5538-native/libpdfium.so\" \\\
        \n  --output \"$RUNNER_TEMP/pdf-5538-font-profile\" \\\n  --flutter \"$FLUTTER_ROOT/bin/flutter\"\n"
    - name: Locate evidence inside the active runner environment
      if: always()
      id: evidence-root
      run: echo "root=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
    - name: Preserve complete and partial observations
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-font-profile-abc-linux-x64
        retention-days: 90
        if-no-files-found: warn
        path: '${{ steps.evidence-root.outputs.root }}/pdf-5538-font-profile/**/*.json

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-font-profile/**/*.log

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-font-profile/**/*.png

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-font-profile/**/*.pdf

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-font-session/**

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-font-preflight/**

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-native/*.json

          '
