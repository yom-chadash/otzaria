name: Performance probe tools

on:
  pull_request:
    paths:
      - 'tool/perf_probe/**'
      - 'tool/pdf_multi_window/**'
      - 'lib/core/diagnostics/**'
      - 'lib/plugins/services/plugin_webview_diagnostics.dart'
      - 'lib/plugins/services/webview_backend_observation.dart'
      - 'lib/plugins/view/plugin_webview_host.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/core/diagnostics/**'
      - 'test/plugins/services/plugin_webview_diagnostics_test.dart'
      - 'test/plugins/services/webview_backend_observation_test.dart'
      - 'test/tool/perf_probe/webview_probe_metrics_test.dart'
      - 'test/tool/perf_probe/perf_fixture_test.dart'
      - 'test/tool/perf_probe/report_test.dart'
      - 'test/tool/perf_probe/perf_recorder_test.dart'
      - 'test/tool/perf_probe/probe_binding_test.dart'
      - 'test/tool/perf_probe/probe_engine_test.dart'
      - 'lib/core/windowing/**'
      - 'lib/pdf_book/**'
      - 'integration_test/pdf_multi_window_smoke.dart'
      - 'integration_test/support/pdf_multi_window_*.dart'
      - 'test/pdf_book/pdf_multi_window_contract_test.dart'
      - 'integration_test/support/webview_probe_fixture.dart'
      - 'integration_test/support/webview_probe_metrics.dart'
      - 'integration_test/support/webview_probe_window.dart'
      - 'integration_test/support/perf_recorder.dart'
      - 'integration_test/support/perf_resource_workload.dart'
      - 'integration_test/support/perf_binding_contract.dart'
      - 'integration_test/support/perf_fixture.dart'
      - 'integration_test/support/perf_probe_wait.dart'
      - 'integration_test/perf_resource_probe_test.dart'
      - 'integration_test/webview_resource_probe_test.dart'
      - 'test_driver/webview_resource_probe.dart'
      - '.github/workflows/perf_probe.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode (results are never compared across modes)
        type: choice
        options: [profile, debug]
        default: profile
      cache_state:
        description: Application data state (OS caches are not cleared)
        type: choice
        options: [cold, warm]
        default: cold
      launches:
        description: Measured process launches
        type: number
        default: 3
      repetitions:
        description: Measured repetitions per action and launch
        type: number
        default: 5

permissions:
  contents: read

# A new push to a PR supersedes its previous run; a manual measurement is never cancelled.
concurrency:
  group: perf-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/ci_gate.yml
    permissions:
      contents: read
      pull-requests: read

  contracts:
    name: Sampler contracts (no performance thresholds)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate process identity and invariant CSV formatting
        shell: pwsh
        run: ./tool/perf_probe/test_sample_resources.ps1
      - name: Validate the general integration binding identity
        shell: pwsh
        run: ./tool/perf_probe/test_probe_binding.ps1
      - name: Validate the bundled Windows engine and patch identity
        shell: pwsh
        run: ./tool/perf_probe/test_probe_engine.ps1
      - name: Validate backend correlation and comparison readiness
        shell: pwsh
        run: ./tool/perf_probe/test_webview_hosting_probe.ps1
      - name: Validate WebView fixture state and bounded observers
        run: node --test tool/perf_probe/test_webview_probe_fixture.mjs
      - name: Validate native window source and engine evidence
        run: python3 -B -m unittest tool.pdf_multi_window.test_run_smoke -v

  pdf-windows:
    name: Two native PDF windows (Windows release correctness)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the existing patched release engine
        uses: ./.github/actions/patched-flutter-engine
        with:
          arch: x64
      - name: Validate native window evidence and owned-process cleanup
        shell: pwsh
        run: |
          python -B -m unittest tool.pdf_multi_window.test_run_smoke -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --reporter expanded test/pdf_book/pdf_multi_window_contract_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require two native PDF windows and clean teardown
        shell: pwsh
        run: |
          if ($env:PATCHED_FLUTTER_DLL_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw 'The patched engine action did not provide a verified DLL hash.'
          }
          python tool/pdf_multi_window/run_smoke.py --platform windows --mode release `
            --expected-engine-sha256 $env:PATCHED_FLUTTER_DLL_SHA256 `
            --output (Join-Path $env:RUNNER_TEMP 'pdf-multi-window-correctness')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve correctness evidence and partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-multi-window-windows-release-correctness
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/pdf-multi-window-correctness/*.json
            ${{ runner.temp }}/pdf-multi-window-correctness/*.log
            ${{ runner.temp }}/pdf-multi-window-correctness/run/**

  webview:
    name: Live WebView2 resource scenario (profile)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.7
      - name: Resolve pinned dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile
      - name: Validate process coverage with the real Windows host sampler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/webview-probe' | Out-Null
          flutter test --no-pub --reporter expanded `
            test/core/diagnostics/process_tree_sampler_test.dart `
            test/core/diagnostics/process_tree_coverage_test.dart `
            test/core/diagnostics/frame_stats_overlay_test.dart `
            test/plugins/services/plugin_webview_diagnostics_test.dart `
            test/plugins/services/webview_backend_observation_test.dart `
            test/tool/perf_probe/webview_probe_metrics_test.dart `
            test/tool/perf_probe/perf_recorder_test.dart `
            test/tool/perf_probe/probe_binding_test.dart `
            test/tool/perf_probe/probe_engine_test.dart `
            2>&1 | Tee-Object -FilePath '${{ runner.temp }}/webview-probe/process-coverage-tests.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the native scenario without performance thresholds
        shell: pwsh
        env:
          WEBVIEW_PROBE_REPORTS: ${{ runner.temp }}/webview-probe/host
          WEBVIEW_PROBE_DEVICE_OUTPUT: ${{ runner.temp }}/webview-probe/device
          FLUTTER_INAPPWEBVIEW_WINDOWS_FORCE_HWND: '0'
        run: |
          New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/webview-probe' | Out-Null
          flutter drive --profile -d windows --no-pub `
            --driver=test_driver/webview_resource_probe.dart `
            --target=integration_test/webview_resource_probe_test.dart `
            --dart-define=WEBVIEW_PROBE_FLUTTER_VERSION=3.47.7 `
            --dart-define=WEBVIEW_PROBE_COMMIT=${{ github.sha }} `
            --dart-define=WEBVIEW_PROBE_IDLE_MS=1000 `
            2>&1 | Tee-Object -FilePath '${{ runner.temp }}/webview-probe/run.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run forced HWND in a fresh native process
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          WEBVIEW_PROBE_REPORTS: ${{ runner.temp }}/webview-probe/host-hwnd
          WEBVIEW_PROBE_DEVICE_OUTPUT: ${{ runner.temp }}/webview-probe/device-hwnd
          FLUTTER_INAPPWEBVIEW_WINDOWS_FORCE_HWND: '1'
        run: |
          flutter drive --profile -d windows --no-pub `
            --driver=test_driver/webview_resource_probe.dart `
            --target=integration_test/webview_resource_probe_test.dart `
            --dart-define=WEBVIEW_PROBE_FLUTTER_VERSION=3.47.7 `
            --dart-define=WEBVIEW_PROBE_COMMIT=${{ github.sha }} `
            --dart-define=WEBVIEW_PROBE_IDLE_MS=1000 `
            2>&1 | Tee-Object -FilePath '${{ runner.temp }}/webview-probe/run-hwnd.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native observations and partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webview-resource-probe-windows-profile
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/webview-probe/run.log
            ${{ runner.temp }}/webview-probe/run-hwnd.log
            ${{ runner.temp }}/webview-probe/process-coverage-tests.log
            ${{ runner.temp }}/webview-probe/host/**/*.json
            ${{ runner.temp }}/webview-probe/device/**/phases.jsonl
            ${{ runner.temp }}/webview-probe/device/**/report.json
            ${{ runner.temp }}/webview-probe/host-hwnd/**/*.json
            ${{ runner.temp }}/webview-probe/device-hwnd/**/phases.jsonl
            ${{ runner.temp }}/webview-probe/device-hwnd/**/report.json

  desktop:
    name: Manual general Windows measurements (${{ inputs.mode || 'profile' }})
    needs: gate
    if: github.event_name == 'workflow_dispatch' && needs.gate.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: 3.47.7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile
      - name: Run the isolated general integration workload
        shell: pwsh
        env:
          PROBE_MODE: ${{ inputs.mode }}
          PROBE_CACHE: ${{ inputs.cache_state }}
          PROBE_LAUNCHES: ${{ inputs.launches }}
          PROBE_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          ./tool/perf_probe/run_perf_probe.ps1 -Mode $env:PROBE_MODE `
            -CacheState $env:PROBE_CACHE -Launches ([int]$env:PROBE_LAUNCHES) `
            -Repetitions ([int]$env:PROBE_REPETITIONS) `
            -ScenarioSet all -BindingMode integration -Warmup 1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'perf-results') `
            -HardwareId "github-hosted-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require the requested integration workload and a complete report
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'perf-results/report.json') -Raw | ConvertFrom-Json
          if ($report.complete -ne $true -or $report.successful -ne $true) { throw 'The app measurement run did not complete successfully.' }
          Import-Module ./tool/perf_probe/probe_binding.psm1 -Force
          Assert-PerfBindingIdentity $report.metadata.settings 'integration'
          if ($report.metadata.bindingMode -ne 'integration') { throw 'The app ran under the wrong binding.' }
          if ($report.metadata.settings.scenarioSet -ne 'all') { throw 'The app ran the wrong scenario set.' }
      - name: Upload observations, including partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-${{ inputs.mode }}-${{ inputs.cache_state }}-all-integration
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/perf-results/*.json
            ${{ runner.temp }}/perf-results/*.jsonl
            ${{ runner.temp }}/perf-results/*.csv
            ${{ runner.temp }}/perf-results/*.md
            ${{ runner.temp }}/perf-results/*.log
            ${{ runner.temp }}/perf-results/launch-*/*.json*
            ${{ runner.temp }}/perf-results/launch-*/*.log
            ${{ runner.temp }}/perf-results/prepare-*/*.json
            ${{ runner.temp }}/perf-results/prepare-*/*.log
