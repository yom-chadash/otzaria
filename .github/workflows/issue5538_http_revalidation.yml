name: PDF 5538 real HTTP revalidation in fork
'on':
  push:
    branches:
    - perf/5538-final-measurements-20261124
    paths:
    - .github/workflows/issue5538_http_revalidation.yml
    - tool/issue5538_ci/internal_http_revalidation.dart
    - tool/issue5538_ci/internal_http_revalidation_test.dart
    - tool/issue5538_ci/internal_probe.dart
    - tool/issue5538_ci/internal_run.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: pdf-5538-http-revalidation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  revalidation:
    name: AOT HTTP 304, expired validators and partial cache
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: true
    - uses: actions/download-artifact@v8.0.2
      with:
        name: pdf-5538-component-corpus
        path: ${{ runner.temp }}/pdf-5538-inputs
        run-id: 45389994425
        repository: yom-chadash/otzaria
        github-token: ${{ github.token }}
    - name: Verify SDK, locked dependencies and the native producer
      shell: bash
      run: |
        set -euo pipefail
        flutter pub get --enforce-lockfile
        flutter analyze --no-pub
        python3 tool/issue5538_ci/prepare_native_inputs.py --output "$RUNNER_TEMP/pdf-5538-native"
    - name: Measure real 304 reuse and changed resource responses in balanced order
      shell: bash
      run: |
        set -euo pipefail
        corpus="$RUNNER_TEMP/pdf-5538-inputs/pdf-5538-corpus"
        python3 tool/issue5538_ci/internal_run.py --suite http-revalidation \
          --dart "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" \
          --pdfium "$RUNNER_TEMP/pdf-5538-native/libpdfium.so" \
          --flutter-json "$RUNNER_TEMP/pdf-5538-native/flutter.json" \
          --pdf "$corpus/uxlc-genesis.pdf" --pdf "$corpus/gcc-15_2.pdf" \
          --http-pdf "$corpus/gcc-15_2.pdf" --http-linearized "$corpus/gcc-15_2-linearized.pdf" \
          --font fonts/Tinos-Regular.ttf --output "$RUNNER_TEMP/pdf-5538-http-revalidation"
    - name: Preserve instrumentation, source identity and all observations
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-http-revalidation-linux-x64
        retention-days: 90
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/pdf-5538-native/flutter.json
          ${{ runner.temp }}/pdf-5538-native/producer.json
          ${{ runner.temp }}/pdf-5538-http-revalidation/**
