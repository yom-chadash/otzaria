name: PDF 5538 MG book navigation diagnosis in fork

on:
  push:
    branches: [ci/5538-navigation-diagnostic-20261124]
    paths:
      - .github/workflows/issue5538_navigation_diagnostics.yml
      - tool/issue5538_ci/navigation_trace_plan.json
      - tool/issue5538_ci/run_navigation_diagnostics.py
      - integration_test/support/pdf_navigation_trace.dart
      - test/tool/perf_probe/pdf_navigation_trace_test.dart
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pdf-5538-navigation-diagnostic-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  windows_profile:
    name: MG374 book jump280 / three diagnostic cold launches
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pdf-5538-pinned-corpus
          path: ${{ runner.temp }}/pdf-5538-inputs
          run-id: 45392015952
          repository: yom-chadash/otzaria
          github-token: ${{ github.token }}
      - name: Diagnose the same application handler without sleeps or retries
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = Get-Content -LiteralPath tool/issue5538_ci/navigation_trace_plan.json -Raw | ConvertFrom-Json
          if ($plan.schemaVersion -ne 1 -or $plan.candidate -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Diagnostic plan requires one full immutable source SHA.'
          }
          git fetch --no-tags --depth=1 origin $plan.candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tool/issue5538_ci/run_navigation_diagnostics.py `
            --commit $plan.candidate `
            --pdf-case (Join-Path $env:RUNNER_TEMP 'pdf-5538-inputs/pdf-5538-corpus/cases/mikraot-gedolot-genesis-1859.json') `
            --output (Join-Path $env:RUNNER_TEMP 'pdf-5538-navigation-diagnostics') `
            --launches 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostic failures and source receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-5538-navigation-windows-profile
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/diagnostic-summary.json
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/native-build.json
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/logs/*.log
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/attempt-*/**/*.json
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/attempt-*/**/*.jsonl
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/attempt-*/**/*.csv
            ${{ runner.temp }}/pdf-5538-navigation-diagnostics/attempt-*/**/*.log
