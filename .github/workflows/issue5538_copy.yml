name: PDF 5538 real clipboard in fork
'on':
  push:
    branches:
    - perf/5538-final-measurements-20261124
    paths:
    - .github/workflows/issue5538_copy.yml
    - tool/issue5538_ci/copy_profile_app.dart
    - tool/issue5538_ci/run_copy_profile.py
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: pdf-5538-copy-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  copy:
    name: Linux profile / actual clipboard / ${{ matrix.document }}
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
    - name: Prepare the supported Linux build container
      run: "set -euo pipefail\napt-get update -y\napt-get install -y ca-certificates curl git jq unzip xz-utils zstd python3\
        \ nodejs \\\n  build-essential clang-14 cmake libblkid1 libcurl4-openssl-dev libglib2.0-dev \\\n  libgtk-3-dev liblzma5\
        \ liblzma-dev libsecret-1-dev libsoup-3.0-dev \\\n  libwebkit2gtk-4.1-dev libxkbcommon-dev ninja-build openjdk-17-jdk-headless\
        \ \\\n  pkg-config xvfb xauth xclip binutils dbus dbus-x11 openbox wmctrl x11-utils \\\n  x11-xserver-utils libgl1-mesa-dri\
        \ libegl1 libglx-mesa0 mesa-utils\nupdate-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100\nupdate-alternatives\
        \ --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100\ngit config --global --add safe.directory '*'\n{\n  echo\
        \ \"RUSTUP_HOME=$RUNNER_TEMP/pdf-5538-rustup\"\n  echo \"CARGO_HOME=$RUNNER_TEMP/pdf-5538-cargo\"\n  echo 'JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'\n\
        \  echo 'WPE_SDK=/opt/wpe-sdk'\n  echo 'PKG_CONFIG_PATH=/opt/wpe-sdk/lib/pkgconfig'\n  echo 'LD_LIBRARY_PATH=/opt/wpe-sdk/lib'\n\
        \  echo 'LIBRARY_PATH=/opt/wpe-sdk/lib'\n  echo 'CC=clang'\n  echo 'CXX=clang++'\n  echo 'CFLAGS=-Wno-error=unknown-warning-option'\n\
        \  echo 'CXXFLAGS=-Wno-error=unknown-warning-option'\n  echo 'LIBGL_ALWAYS_SOFTWARE=1'\n} >> \"$GITHUB_ENV\"\n"
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: 'false'
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/download-artifact@v8.0.2
      with:
        name: pdf-5538-pinned-corpus
        path: ${{ runner.temp }}/pdf-5538-inputs
        run-id: 45392015952
        repository: yom-chadash/otzaria
        github-token: ${{ github.token }}
    - name: Install the pinned Linux WPE runtime
      env:
        WPE_RUNTIME_SHA256: ca7e706c0ec2f66623fede2c369e3e13339448843e125f2ccd1553f4a3c4bcaf
      run: 'set -euo pipefail

        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

        asset=wpe-runtime-2.48.7-linux-x86_64.tar.zst

        base=https://github.com/Otzaria/otzaria-wpe-runtime/releases/download/wpe-2.48.7-print-to-pdf

        curl -fSL --retry 3 --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/$asset" "$base/$asset"

        printf ''%s  %s\n'' "$WPE_RUNTIME_SHA256" "$RUNNER_TEMP/$asset" | sha256sum -c -

        tar -C /opt -I zstd -xf "$RUNNER_TEMP/$asset"

        pkg-config --print-errors --exists wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0 wpe-1.0

        '
    - name: Resolve locked dependencies and verify the native producer
      run: 'set -euo pipefail

        flutter pub get --enforce-lockfile

        python3 tool/issue5538_ci/prepare_native_inputs.py --output "$RUNNER_TEMP/pdf-5538-native"

        '
    - name: Measure native select-all and copy, then read X11 clipboard independently
      run: "set -euo pipefail\nbash tool/issue5538_ci/run_linux_desktop.sh \"$RUNNER_TEMP/pdf-5538-session\" \\\n  python3\
        \ tool/issue5538_ci/run_copy_profile.py \\\n  --corpus \"$RUNNER_TEMP/pdf-5538-inputs/pdf-5538-corpus/corpus.json\"\
        \ \\\n  --document \"$COPY_DOCUMENT\" \\\n  --pdfium \"$RUNNER_TEMP/pdf-5538-native/libpdfium.so\" \\\n  --output\
        \ \"$RUNNER_TEMP/pdf-5538-copy\"\n"
      env:
        COPY_DOCUMENT: ${{ matrix.document }}
    - name: Locate evidence inside the active runner environment
      if: always()
      id: evidence-root
      run: echo "root=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
    - name: Preserve complete and partial observations
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-copy-${{ matrix.document }}
        retention-days: 90
        if-no-files-found: warn
        path: '${{ steps.evidence-root.outputs.root }}/pdf-5538-copy/**

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-session/**

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-native/*.json

          '
    strategy:
      fail-fast: false
      matrix:
        document:
        - uxlc-genesis
        - mikraot-gedolot-genesis-1859
        - letteris-hebrew-1910
