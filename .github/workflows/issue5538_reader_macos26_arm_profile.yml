name: PDF 5538 macOS 26 ARM profile continuous reader completion
'on':
  push:
    branches:
    - perf/5538-final-measurements-20261124
    paths:
    - .github/workflows/issue5538_reader_macos26_arm_profile.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: pdf-5538-reader-macos26-arm-profile-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  contracts:
    name: Build receipt and runner contracts / ${{ matrix.os }}
    if: github.repository == 'yom-chadash/otzaria'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.13'
    - name: Require the original A4/C4 profile source pair
      shell: bash
      run: "set -euo pipefail\npython -B - <<'PY'\nimport json\nfrom pathlib import Path\nplan=json.loads(Path('tool/issue5538_ci/campaign_plan.profile.json').read_text())\n\
        expected={'baseline': '6ada2838b7041f770d874959f874a200f3f19aa6', 'candidate': 'bae04dfe63eb33076161af3e48e7274cd5857cc1'}\n\
        if any(plan.get(key)!=value for key,value in expected.items()):\n    raise SystemExit('ARM retry requires\
        \ the same immutable A4/C4 source pair.')\nprint('Verified the same frozen A4/C4 sources for the ARM profile\
        \ retry.')\nPY\n"
    - name: Verify both frozen source pairs and the orchestrator before native builds
      shell: bash
      run: 'python -B tool/issue5538_ci/prepare_campaign.py --plan tool/issue5538_ci/campaign_plan.profile.json

        python -B tool/issue5538_ci/prepare_campaign.py --plan tool/issue5538_ci/campaign_plan.release.json

        '
    - name: Immutable receipt and native orchestration contracts
      run: 'python -B -m unittest discover -s tool/perf_probe -p ''test_build_receipt.py''

        python -B -m unittest discover -s tool/perf_probe -p ''test_pdf_pair.py''

        '
      shell: bash
    - name: POSIX owned-process and engine mapping contracts
      if: runner.os == 'Linux'
      shell: bash
      run: 'python -B -m unittest discover -s tool/perf_probe -p ''test_perf_probe_posix.py''

        python -B -m unittest discover -s tool/perf_probe -p ''test_posix_engine.py''

        '
    - name: Parse native Windows entrypoints before any app build
      if: runner.os == 'Windows'
      shell: pwsh
      run: "Set-StrictMode -Version Latest\n$ErrorActionPreference = 'Stop'\nforeach ($path in @('tool/perf_probe/runner.ps1',\
        \ 'tool/perf_probe/run_perf_probe.ps1')) {\n  $tokens = $null\n  $parseErrors = $null\n  [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path\
        \ $PWD $path), [ref]$tokens, [ref]$parseErrors)\n  if ($parseErrors.Count) { throw ($parseErrors | Out-String)\
        \ }\n}\n"
  posix:
    name: macOS 26 ARM64 / profile / same frozen continuous-reader pairs
    needs: contracts
    if: github.repository == 'yom-chadash/otzaria'
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform:
            name: macos
            arch: arm64
            runner: macos-26
            container: ''
          mode: profile
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
      CAMPAIGN_MODE: ${{ matrix.mode }}
    steps:
    - name: Record the distinct macOS 26 native ARM host
      run: "set -euo pipefail\npython3 - <<'HOST'\nimport json, os, pathlib, platform\nassert platform.system()\
        \ == 'Darwin' and platform.machine() == 'arm64'\nassert platform.mac_ver()[0].split('.')[0] == '26'\nroot\
        \ = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pdf-5538-arm-host'\nroot.mkdir()\n(root / 'runner.json').write_text(json.dumps({\n\
        \    'platform': platform.platform(), 'architecture': platform.machine(),\n    'macOSVersion': platform.mac_ver()[0],\
        \ 'runnerLabel': 'macos-26',\n    'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'),\n\
        \    'baseline': '6ada2838b7041f770d874959f874a200f3f19aa6',\n    'candidate': 'bae04dfe63eb33076161af3e48e7274cd5857cc1',\n\
        \    'timingsPooledAcrossHostsOrOperatingSystems': False,\n    'reason': 'Previous macos-15 ARM jobs did\
        \ not acquire a runner; this is a separate supported OS image with the same SDK, sources and full paired\
        \ blocks.'\n}, indent=2) + '\\n')\nHOST\n"
    - name: Prepare the supported Linux build container
      if: matrix.platform.name == 'linux'
      run: "set -euo pipefail\napt-get update -y\napt-get install -y ca-certificates curl git jq unzip xz-utils\
        \ zstd python3 nodejs \\\n  build-essential clang-14 cmake libblkid1 libcurl4-openssl-dev libglib2.0-dev\
        \ \\\n  libgtk-3-dev liblzma5 liblzma-dev libsecret-1-dev libsoup-3.0-dev \\\n  libwebkit2gtk-4.1-dev libxkbcommon-dev\
        \ ninja-build openjdk-17-jdk-headless \\\n  pkg-config xvfb xauth binutils dbus dbus-x11 openbox wmctrl\
        \ x11-utils \\\n  x11-xserver-utils libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils\nupdate-alternatives\
        \ --install /usr/bin/clang clang /usr/bin/clang-14 100\nupdate-alternatives --install /usr/bin/clang++ clang++\
        \ /usr/bin/clang++-14 100\ngit config --global --add safe.directory '*'\n{\n  echo \"RUSTUP_HOME=$RUNNER_TEMP/pdf-5538-rustup\"\
        \n  echo \"CARGO_HOME=$RUNNER_TEMP/pdf-5538-cargo\"\n  echo 'JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'\n\
        \  echo 'WPE_SDK=/opt/wpe-sdk'\n  echo 'PKG_CONFIG_PATH=/opt/wpe-sdk/lib/pkgconfig'\n  echo 'LD_LIBRARY_PATH=/opt/wpe-sdk/lib'\n\
        \  echo 'LIBRARY_PATH=/opt/wpe-sdk/lib'\n  echo 'CC=clang'\n  echo 'CXX=clang++'\n  echo 'CFLAGS=-Wno-error=unknown-warning-option'\n\
        \  echo 'CXXFLAGS=-Wno-error=unknown-warning-option'\n  echo 'LIBGL_ALWAYS_SOFTWARE=1'\n} >> \"$GITHUB_ENV\"\
        \n"
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: 'false'
    - name: Bootstrap Flutter before strict machine identity
      run: 'set -euo pipefail

        flutter --version

        '
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v7.1.0
      if: matrix.platform.name == 'macos'
      with:
        python-version: '3.15'
    - uses: actions/download-artifact@v8.0.2
      with:
        name: pdf-5538-pinned-corpus
        path: ${{ runner.temp }}/pdf-5538-inputs
        run-id: 45392015952
        repository: yom-chadash/otzaria
        github-token: ${{ github.token }}
    - name: Install the pinned Linux WPE runtime
      if: matrix.platform.name == 'linux'
      env:
        WPE_RUNTIME_SHA256: ca7e706c0ec2f66623fede2c369e3e13339448843e125f2ccd1553f4a3c4bcaf
      run: 'set -euo pipefail

        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

        asset=wpe-runtime-2.48.7-linux-x86_64.tar.zst

        base=https://github.com/Otzaria/otzaria-wpe-runtime/releases/download/wpe-2.48.7-print-to-pdf

        curl -fSL --retry 3 --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/$asset" "$base/$asset"

        printf ''%s  %s\n'' "$WPE_RUNTIME_SHA256" "$RUNNER_TEMP/$asset" | sha256sum -c -

        tar -C /opt -I zstd -xf "$RUNNER_TEMP/$asset"

        pkg-config --print-errors --exists wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0 wpe-1.0

        '
    - name: Freeze one native build per source and measure all corpus conditions
      run: "set -euo pipefail\nplan=\"tool/issue5538_ci/campaign_plan.$CAMPAIGN_MODE.json\"\npython3 tool/issue5538_ci/prepare_campaign.py\
        \ --plan \"$plan\"\narguments=(tool/issue5538_ci/run_campaign.py --plan \"$plan\"\n  --corpus \"$RUNNER_TEMP/pdf-5538-inputs/pdf-5538-corpus/cases\"\
        \n  --output \"$RUNNER_TEMP/pdf-5538-campaign\" --mode \"$CAMPAIGN_MODE\")\nif [ \"$RUNNER_OS\" = Linux\
        \ ]; then\n  arguments+=(--display-mode xvfb)\n  mkdir -p \"$RUNNER_TEMP/pdf-5538-session/runtime\"\n  chmod\
        \ 700 \"$RUNNER_TEMP/pdf-5538-session/runtime\"\n  export XDG_RUNTIME_DIR=\"$RUNNER_TEMP/pdf-5538-session/runtime\"\
        \n  export XDG_SESSION_TYPE=x11 GDK_BACKEND=x11\n  xvfb-run --auto-servernum --error-file=\"$RUNNER_TEMP/pdf-5538-session/xvfb.log\"\
        \ \\\n    --server-args='-screen 0 1440x1000x24 -dpi 96 -nolisten tcp' \\\n    dbus-run-session -- bash\
        \ -s -- \"${arguments[@]}\" <<'SESSION'\nset -euo pipefail\nopenbox --sm-disable > \"$RUNNER_TEMP/pdf-5538-session/openbox.log\"\
        \ 2>&1 &\nwm=$!\ntrap 'kill \"$wm\" 2>/dev/null || true; wait \"$wm\" 2>/dev/null || true' EXIT\nready=0\n\
        for attempt in {1..100}; do\n  if wmctrl -m > \"$RUNNER_TEMP/pdf-5538-session/window-manager.txt\" 2>&1\
        \ &&\n     grep -q 'Name: Openbox' \"$RUNNER_TEMP/pdf-5538-session/window-manager.txt\"; then\n    ready=1\n\
        \    break\n  fi\n  kill -0 \"$wm\"\n  sleep 0.1\ndone\ntest \"$ready\" = 1\nxdpyinfo > \"$RUNNER_TEMP/pdf-5538-session/display.txt\"\
        \npython3 -B \"$@\"\nSESSION\nelse\n  python3 -B \"${arguments[@]}\"\nfi\n"
    - name: Locate evidence inside the active runner environment
      if: always()
      id: evidence-root
      run: echo "root=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
    - name: Preserve complete and partial evidence
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-reader-macos26-arm64-profile
        retention-days: 90
        if-no-files-found: warn
        path: '${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.json

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.jsonl

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.csv

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.log

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.md

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-session/**

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-arm-host/**

          '
