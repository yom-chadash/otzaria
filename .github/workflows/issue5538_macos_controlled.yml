name: PDF 5538 macOS with controlled client viewport
'on':
  push:
    branches:
    - ci/5538-macos-controlled-20261124
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: pdf-5538-macos-controlled-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  release:
    name: macOS Intel / ${{ matrix.mode }} / controlled client viewport
    if: github.repository == 'yom-chadash/otzaria'
    strategy:
      fail-fast: false
      matrix:
        platform:
        - name: macos
          runner: macos-15-intel
          container: ''
        mode:
        - profile
        - release
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_BUILD_JOBS: '2'
      CAMPAIGN_MODE: ${{ matrix.mode }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: 'false'
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: 'false'
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v7.1.0
      if: matrix.platform.name == 'macos'
      with:
        python-version: '3.15'
    - uses: actions/download-artifact@v8.0.2
      with:
        name: pdf-5538-pinned-corpus
        path: ${{ runner.temp }}/pdf-5538-inputs
        run-id: 45392015952
        repository: yom-chadash/otzaria
        github-token: ${{ github.token }}
    - name: Fetch immutable sources and measure on this host
      run: "set -euo pipefail\nplan=\"tool/issue5538_ci/campaign_plan.$CAMPAIGN_MODE.json\"\npython3 tool/issue5538_ci/prepare_campaign.py --plan \"$plan\"\narguments=(tool/issue5538_ci/run_campaign.py --plan \"$plan\"\n  --corpus \"$RUNNER_TEMP/pdf-5538-inputs/pdf-5538-corpus/cases\"\n  --output \"$RUNNER_TEMP/pdf-5538-campaign\" --mode \"$CAMPAIGN_MODE\")\nif [ \"$RUNNER_OS\" = Linux ]; then\n  arguments+=(--display-mode xvfb)\n  mkdir -p \"$RUNNER_TEMP/pdf-5538-session/runtime\"\n  chmod 700 \"$RUNNER_TEMP/pdf-5538-session/runtime\"\n  export XDG_RUNTIME_DIR=\"$RUNNER_TEMP/pdf-5538-session/runtime\"\n  export XDG_SESSION_TYPE=x11 GDK_BACKEND=x11\n  xvfb-run --auto-servernum --error-file=\"$RUNNER_TEMP/pdf-5538-session/xvfb.log\" \\\n    --server-args='-screen 0 1440x1000x24 -dpi 96 -nolisten tcp' \\\n    dbus-run-session -- bash -s -- \"${arguments[@]}\" <<'SESSION'\nset -euo pipefail\nopenbox --sm-disable > \"$RUNNER_TEMP/pdf-5538-session/openbox.log\" 2>&1 &\nwm=$!\ntrap 'kill \"$wm\"\
        \ 2>/dev/null || true; wait \"$wm\" 2>/dev/null || true' EXIT\nready=0\nfor attempt in {1..100}; do\n  if wmctrl -m > \"$RUNNER_TEMP/pdf-5538-session/window-manager.txt\" 2>&1 &&\n     grep -q 'Name: Openbox' \"$RUNNER_TEMP/pdf-5538-session/window-manager.txt\"; then\n    ready=1\n    break\n  fi\n  kill -0 \"$wm\"\n  sleep 0.1\ndone\ntest \"$ready\" = 1\nxdpyinfo > \"$RUNNER_TEMP/pdf-5538-session/display.txt\"\npython3 -B \"$@\"\nSESSION\nelse\n  python3 -B \"${arguments[@]}\"\nfi\n"
    - name: Locate evidence inside the active runner environment
      if: always()
      id: evidence-root
      run: echo "root=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
    - name: Preserve complete and partial evidence
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: pdf-5538-${{ matrix.platform.name }}-${{ matrix.mode }}-intel
        retention-days: 90
        if-no-files-found: warn
        path: '${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.json

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.jsonl

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.csv

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.log

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-campaign/**/*.md

          ${{ steps.evidence-root.outputs.root }}/pdf-5538-session/**

          '
